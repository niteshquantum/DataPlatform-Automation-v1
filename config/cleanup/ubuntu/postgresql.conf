SERVICE_MODEL=process
PROCESS_NAME=postgres
PROCESS_EXECUTABLE=databases/postgresql/bin/pg_ctl

TERRAFORM_DIRECTORY=terraform/postgresql
TERRAFORM_RESOURCES=postgresql_install_linux,postgresql_start_linux,postgresql_validate_linux

CLEANUP_OWNERSHIP=platform

INSTALLATION_DIR=databases/postgresql
RUNTIME_DATA_DIR=databases/postgresql/data
RUNTIME_TEMP_DIR=outputs/temp/postgresql

LIQUIBASE_ENABLED=true
LIQUIBASE_DIR=liquibase/postgresql
LIQUIBASE_CHANGELOG=liquibase_postgresql.xml

ARTIFACT_OWNERSHIP=cleanup
ARCHIVE_DIR=archive/postgresql
FAILED_DIR=failed/postgresql
INCOMING_DIR=incoming/postgresql
HISTORY_FILE=metadata/postgresql/data_load_history.jsonl

CLEANUP_DATA_ENABLED_UBUNTU=false
RESET_TERRAFORM_ONLY=false
XML_CLEANUP_ENABLED=true
